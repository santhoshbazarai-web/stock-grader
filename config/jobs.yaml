# jobs.yaml — validated at startup by app.core.config (fail fast on invalid values).
# Worker schedules (SPEC §10) and job parameters. Cron fields: minute hour day month weekday,
# evaluated in `timezone`. A job listed here but not yet implemented is skipped by the worker.

jobs:
  timezone: Asia/Kolkata
  lock_ttl_s: 7200            # Redis lock expiry: a crashed run frees its lock after this
  misfire_grace_s: 900        # run a missed trigger if the worker comes back within this
  schedules:
    corporate_actions: "0 18 * * mon-fri"   # before eod_prices so adjustment sees new actions
    eod_prices: "15 18 * * mon-fri"
    nse_bhavcopy: "45 18 * * mon-fri"
    technicals: "15 19 * * mon-fri"
    valuation_scores: "45 19 * * mon-fri"
    alerts_intraday: "*/5 9-15 * * mon-fri"  # the job itself trims to market hours (P14)
    shareholding: "30 20 * * *"              # runs only inside shareholding_season
    index_constituents: "0 7 1 * *"
    results_watch: "0 21 * * *"              # XBRL results filings (all year; see results_watch)
    refresh_queue: "* * * * *"               # drains POST /api/stocks/{symbol}/refresh requests
    backtests: "* * * * *"                   # runs queued POST /api/backtests requests
    annual_reports: "30 22 * * 6"            # annual-report PDFs for BS/CF gaps (Saturdays)
  universe_index: NIFTY500    # symbols = current members of this index + watchlist
  constituent_indices: [NIFTY500, NIFTY50, NIFTYBANK, NIFTYIT, NIFTYPHARMA, NIFTYFMCG,
                        NIFTYAUTO, NIFTYMETAL, NIFTYREALTY]
  benchmark_indices: [NIFTY500, NIFTY50, NIFTYBANK, NIFTYIT, NIFTYPHARMA, NIFTYFMCG,
                      NIFTYAUTO, NIFTYMETAL, NIFTYREALTY]
  eod_prices:
    overlap_days: 7           # re-fetch this many days before the last stored bar (late fixes)
  corporate_actions:
    lookback_days: 30         # scheduled runs; --full / new symbols use nse.corporate_actions_from_years
  shareholding_season:        # SEBI: filed within 21 days of quarter end
    months: [1, 4, 7, 10]
    days: [1, 31]
  alerts:                     # alerts_intraday (SPEC §8 alert types)
    market_open: "09:15"      # IST; outside this window the job skips (unless --force)
    market_close: "15:30"
    hysteresis_pct: 0.002     # a level counts as crossed only once price clears it by 0.2%
    cooldown_minutes: 60      # the same alert does not fire again within this window
    telegram_timeout_s: 10
  backtest:                   # SPEC §11
    benchmark: NIFTY500       # price index; used when the TRI below has no stored prices
    benchmark_tri: NIFTY500TRI
    cost_per_side: 0.001      # brokerage + slippage, each buy and each sell
    stt_buy: 0.001            # securities transaction tax, equity delivery
    stt_sell: 0.001
    execution_lag_days: 1     # signals use data to the rebalance close; trade N sessions later
    equity_curve_points: weekly
  results_watch:              # exchange results filings (XBRL) → fin_quarterly / fin_annual
    max_downloads_per_run: 300  # XBRL documents per run; a 10-year backfill spreads over nights
    index_recheck_days: 7       # outside results_season, re-read each symbol's filing list weekly
    max_attempts: 3             # a filing that fails to download/parse this often stays failed
  annual_reports:             # annual-report PDF gap filler (SPEC §3.6 step 3)
    max_downloads_per_run: 25   # PDFs are large; a backfill spreads over weeks
    max_attempts: 3
    required_items:             # a fiscal year missing any of these needs its annual report
      bs: [total_assets, total_equity]
      cf: [cfo]
    first_fiscal_year: 2010     # NSE's annual-report list starts around FY2009-10
  results_season:             # quarterly results: within 45 days (60 for Q4) of quarter end
    months: [1, 2, 4, 5, 7, 8, 10, 11]
    days: [1, 31]
