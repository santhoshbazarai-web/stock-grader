# jobs.yaml — validated at startup by app.core.config (fail fast on invalid values).
# Worker schedules (SPEC §10) and job parameters. Cron fields: minute hour day month weekday,
# evaluated in `timezone`. A job listed here but not yet implemented is skipped by the worker.

jobs:
  timezone: Asia/Kolkata
  lock_ttl_s: 7200            # Redis lock expiry: a crashed run frees its lock after this
  misfire_grace_s: 900        # run a missed trigger if the worker comes back within this
  schedules:
    corporate_actions: "0 18 * * mon-fri"   # before eod_prices so adjustment sees new actions
    eod_prices: "15 18 * * mon-fri"
    nse_bhavcopy: "45 18 * * mon-fri"
    technicals: "15 19 * * mon-fri"
    valuation_scores: "30 23 * * *"          # nightly precompute: after results and shareholding
    alerts_intraday: "*/5 9-15 * * mon-fri"  # the job itself trims to market hours (P14)
    shareholding: "30 20 * * *"              # runs only inside shareholding_season
    index_constituents: "0 7 1 * *"
    results_backfill: "0 21 * * *"              # XBRL results filings (all year; see results_backfill)
    refresh_queue: "* * * * *"               # queued pipeline runs, if the worker loop missed any
    backtests: "* * * * *"                   # runs queued POST /api/backtests requests
    annual_reports: "30 22 * * 6"            # annual-report PDFs for BS/CF gaps (Saturdays)
    symbol_master: "15 7 * * *"              # NSE/BSE/Fyers symbol masters + aliases (daily)
    results_watch: "*/15 7-22 * * *"         # results filings in the feeds → pipelines (§3.8)
    events: "7,37 7-22 * * *"                # announcements, pledge, SAST, PIT, deals (§10)
    reconcile: "0 23 * * *"                  # cross-source checks for the universe (§3.9)
    bhavcopy_history: "30 1 * * *"           # backfill NSE bhavcopy OHLCV history (budgeted)
    broker_token_check: "45 8 * * mon-fri"   # morning reminder when a broker token expired
    thesis: "15 0 * * *"                     # LLM thesis for watchlist reports (after valuation_scores)
    industry_classification: "40 7 * * 6"    # industry → sector model (industries.yaml), Saturdays
  universe_index: NIFTY500    # symbols = current members of this index + watchlist
  constituent_indices: [NIFTY500, NIFTY50, NIFTYBANK, NIFTYIT, NIFTYPHARMA, NIFTYFMCG,
                        NIFTYAUTO, NIFTYMETAL, NIFTYREALTY]
  benchmark_indices: [NIFTY500, NIFTY50, NIFTYBANK, NIFTYIT, NIFTYPHARMA, NIFTYFMCG,
                      NIFTYAUTO, NIFTYMETAL, NIFTYREALTY]
  eod_prices:
    overlap_days: 7           # re-fetch this many days before the last stored bar (late fixes)
  corporate_actions:
    lookback_days: 30         # scheduled runs; --full / new symbols use nse.corporate_actions_from_years
  shareholding_season:        # SEBI: filed within 21 days of quarter end
    months: [1, 4, 7, 10]
    days: [1, 31]
  alerts:                     # alerts_intraday (SPEC §8 alert types)
    market_open: "09:15"      # IST; outside this window the job skips (unless --force)
    market_close: "15:30"
    hysteresis_pct: 0.002     # a level counts as crossed only once price clears it by 0.2%
    cooldown_minutes: 60      # the same alert does not fire again within this window
    telegram_timeout_s: 10
  doctor:                     # make doctor (§3.10)
    disk_warn_gb: 20
    disk_fail_gb: 5
    backup_max_age_hours: 26    # nightly pg_dump: older than a day and a bit → warning
    worker_max_idle_hours: 26
    bot_max_idle_minutes: 5     # the bot long-polls every 30 s
    nse_timeout_s: 10
  catch_up:                   # on worker start: run jobs missed while the machine was off (§3.10)
    enabled: true
    lookback_hours: 72          # a weekend away: Friday evening's jobs still run on Monday
    skip: [refresh_queue, backtests, alerts_intraday]   # queues / intraday: next trigger is enough
  telegram_bot:               # read-only bot: /grade SYMBOL, /buyzone, /status (P23)
    enabled: true               # runs in the worker once TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID are set
    poll_timeout_s: 30          # long polling: one outbound request open at a time, no webhook
    error_backoff_s: 5          # after a failed poll; doubles up to max_backoff_s
    max_backoff_s: 300
    max_message_age_s: 600      # commands older than 10 min (sent while the bot was down) are skipped
    buyzone_near_pct: 0.03      # /buyzone: in the buy zone, or at most 3% above it
    buyzone_limit: 15
    status_jobs: [eod_prices, nse_bhavcopy, technicals, valuation_scores, results_watch, events,
                  alerts_intraday]
    max_reply_chars: 3900
  industry_classification:    # basic industry → sectors.yaml model (banks, NBFCs, insurers...)
    refresh_days: 90          # classifications rarely change; unclassified stocks go first
    max_per_run: 200          # ~200 s at NSE's 1 request/s
  thesis:                     # optional LLM thesis (SPEC §8a): numbers in → text out, no new facts
    enabled: false            # needs THESIS_LLM_URL (a local Ollama); free, nothing leaves the box
    model: "llama3.1:8b"      # any model the local server has pulled
    timeout_s: 180            # one generation (CPU inference is slow)
    temperature: 0.0
    seed: 7                   # fixed: the same facts give the same text
    max_words: 160
    min_words: 40
    max_attempts: 3           # a rejected draft is retried with the problems listed
    number_rel_tolerance: 0.005   # a cited number must match a fact within 0.5% ...
    max_reasons: 8            # decision / valuation reasons given as facts
    nightly_scope: watchlist  # watchlist | none (the button on the stock page always works)
    max_per_run: 25
    forbidden_phrases:        # predictions and advice beyond the report's own action
      - target price
      - price target
      - guarantee
      - will reach
      - will rise
      - will fall
      - multibagger
      - sure shot
      - risk-free
      - buy now
    fundamentals:             # report.fundamentals given as facts: label and display unit
      roce_latest: {label: "ROCE (latest year)", unit: pct}
      roce_5y_avg: {label: "ROCE (5-year average)", unit: pct}
      roe_latest: {label: "ROE (latest year)", unit: pct}
      opm_latest: {label: "Operating margin (latest year)", unit: pct}
      sales_cagr_5y: {label: "Sales growth (5-year CAGR)", unit: pct}
      eps_cagr_5y: {label: "EPS growth (5-year CAGR)", unit: pct}
      fcf_conversion_5y: {label: "FCF conversion (5 years)", unit: pct}
      cfo_to_ebitda_5y: {label: "Operating cash flow / EBITDA (5 years)", unit: pct}
      debt_to_equity: {label: "Debt / equity", unit: x}
      net_debt_to_ebitda: {label: "Net debt / EBITDA", unit: x}
      interest_coverage: {label: "Interest coverage", unit: x}
      ccc_days: {label: "Cash conversion cycle", unit: days}
      revenue_ttm: {label: "Revenue (trailing 12 months)", unit: cr}
      pat_ttm: {label: "Net profit (trailing 12 months)", unit: cr}
      piotroski: {label: "Piotroski F-score (of 9)", unit: count}
  backtest:                   # SPEC §11
    benchmark: NIFTY500       # price index; used when the TRI below has no stored prices
    benchmark_tri: NIFTY500TRI
    cost_per_side: 0.001      # brokerage + slippage, each buy and each sell
    stt_buy: 0.001            # securities transaction tax, equity delivery
    stt_sell: 0.001
    execution_lag_days: 1     # signals use data to the rebalance close; trade N sessions later
    equity_curve_points: weekly
  results_backfill:              # exchange results filings (XBRL) → fin_quarterly / fin_annual
    max_downloads_per_run: 300  # XBRL documents per run; a 10-year backfill spreads over nights
    index_recheck_days: 7       # outside results_season, re-read each symbol's filing list weekly
    max_attempts: 3             # a filing that fails to download/parse this often stays failed
  results_watch:              # SPEC §3.8
    feeds:                      # read every run; a new results filing for a universe stock → pipeline
      nse: [results, board_meeting]
      bse: [announcement]       # BSE's "Result" announcements are results filings
    lookback_days: 2            # each run re-reads two days (late entries; rows are deduplicated)
    board_meeting_days_ahead: 14
    results_purposes: [financial result, results]   # board-meeting purposes meaning results
    rerun_after_hours: 6        # the same results filed again (other basis, BSE) → no second run
    notify:
      fv_change_rel: 0.05       # notify when grade, zone or action changes, or FV moves > 5%
  events:                     # SPEC §10: exchange event feeds → events table
    feeds:
      nse: [announcement, pledge, sast, insider_trade, bulk_deal, block_deal]
    lookback_days: 2
    first_run_days: 30
    lock_wait_s: 900            # results_watch and events never read the exchanges at once
  event_classification:       # category from an event's title + text; first match wins
    categories:                 # a rule matches when all its (lower-case) words appear
      auditor_resignation: [[auditor, resign], [auditor, cessation], [statutory auditor, vacat]]
      credit_rating_downgrade: [[rating, downgrad], [rating, revised, negative]]
      credit_rating: [[credit rating], [rating]]
      default: [[default, payment], [delay, payment, interest], [default, loan]]
      pledge_invocation: [[invocation], [invoked]]
      results: [[financial result]]
      board_meeting: [[board meeting]]
      dividend: [[dividend]]
      fund_raising: [[preferential], [qualified institutions placement], [rights issue], [fund rais]]
      merger_acquisition: [[acquisition], [amalgamation], [merger], [scheme of arrangement]]
      kmp_change: [[resign], [appointment], [cessation]]
      litigation: [[litigation], [penalty], [show cause], [search and seizure]]
      promoter_sale: [[promoter, sell], [promoter, sale]]
    red_flags: [auditor_resignation, credit_rating_downgrade, default, pledge_invocation]
    auditor_resignation: auditor_resignation
    red_flag_days: 365          # red-flag events of the last year are listed in the report
  reconciliation:             # SPEC §3.9
    tolerance_rel: 0.02         # sources more than 2% apart → an issue
    min_diff_inr: 5000000       # ... and more than ₹50 lakh (lakh vs crore rounding)
    years: 3                    # the latest three fiscal years
    quarters: 4                 # and the latest four quarters (P&L items)
    items: [revenue, ebitda, pat, cfo, total_assets, total_equity]
    sources: [nse_xbrl, annual_report_pdf, market_lens, yfinance]   # first with a value = reference
    unit_factors: [100, 1000, 100000, 10000000]   # a ratio near one of these → units mix-up
    exclude:                    # defined differently at the source: not compared
      yfinance: [ebitda]        # yfinance EBITDA includes other income
  pipeline:                   # on-demand per-symbol pipeline (SPEC §3.7)
    poll_interval_s: 1          # the worker picks up a queued run within a second
    stale_after_s: 300          # no heartbeat for 5 min: the worker died, another resumes it
    max_attempts: 3
    max_report_age_hours: 20    # a report built more than 20 h ago is rebuilt on request
    max_xbrl_downloads: 60      # a new stock's 10-year XBRL backfill over several requests
    max_annual_reports: 2       # PDFs are large; the weekly annual_reports job does the rest
    sse_poll_s: 0.5
    sse_heartbeat_s: 15
    sse_max_minutes: 30
  annual_reports:             # annual-report PDF gap filler (SPEC §3.6 step 3)
    max_downloads_per_run: 25   # PDFs are large; a backfill spreads over weeks
    max_attempts: 3
    required_items:             # a fiscal year missing any of these needs its annual report
      bs: [total_assets, total_equity]
      cf: [cfo]
    first_fiscal_year: 2010     # NSE's annual-report list starts around FY2009-10
  results_season:             # quarterly results: within 45 days (60 for Q4) of quarter end
    months: [1, 2, 4, 5, 7, 8, 10, 11]
    days: [1, 31]
