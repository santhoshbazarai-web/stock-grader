# Production stack: Caddy (HTTPS) → web (Next.js) + api (FastAPI); worker; Postgres with
# nightly backups; Redis. See docs/DEPLOY.md. Always run it through the Makefile (make prod-*)
# or with the same flags:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Every setting comes from .env.production (copy .env.production.example). Only Caddy
# publishes ports; Postgres and Redis are reachable only from inside the stack.
name: stock-grader-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build: ./backend
  image: stock-grader-backend:${IMAGE_TAG:-latest}
  env_file: .env.production
  # These are derived from DOMAIN / POSTGRES_* and override anything in the env file, so the
  # URLs the brokers redirect to always match the domain Caddy serves.
  environment:
    APP_ENV: production
    CONFIG_DIR: /config
    RAW_DATA_DIR: /data/raw   # raw XBRL / filing-list cache, parsed from here (SPEC §3.2a)
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockgrader}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-stockgrader}
    REDIS_URL: redis://redis:6379/0
    WEB_URL: https://${DOMAIN:?set DOMAIN in .env.production}
    SESSION_COOKIE_SECURE: "true"
    FYERS_REDIRECT_URI: https://${DOMAIN}/api/brokers/fyers/callback
    KITE_REDIRECT_URI: https://${DOMAIN}/api/brokers/kite/callback
    # Only Caddy may report the client IP (X-Forwarded-For) for the login lockout.
    TRUSTED_PROXIES: '["${CADDY_IP:-172.30.0.10}"]'
  volumes:
    - ${CONFIG_PATH:-./config}:/config:ro
    - rawdata:/data/raw
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account: keep this volume
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IP:-172.30.0.10}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  web:
    build: ./frontend
    image: stock-grader-web:${IMAGE_TAG:-latest}
    environment:
      API_URL: http://api:8000
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  # Applies Alembic migrations, then exits; api and worker start only after it succeeds.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    volumes:
      # Read-write: Settings → Config saves here. The directory must be writable by uid 1000.
      - ${CONFIG_PATH:-./config}:/config
      - rawdata:/data/raw
    networks: [edge, backend]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockgrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockgrader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  # Nightly pg_dump into BACKUP_PATH (see deploy/backup/). Copy that directory off the server.
  backup:
    image: postgres:16-alpine
    entrypoint: ["/backup/run.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-stockgrader}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-stockgrader}
      BACKUP_AT: ${BACKUP_AT:-23:30}
      BACKUP_TZ: ${BACKUP_TZ:-IST-5:30}
      TZ: ${BACKUP_TZ:-IST-5:30} # also for `make prod-backup` (docker compose exec)
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ./deploy/backup:/backup:ro
      - ${BACKUP_PATH:-./backups}:/backups
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      migrate: # so the start-up backup has the current schema
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/backup/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      start_period: 10m
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "300", "1"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  backend: {}

volumes:
  rawdata:   # re-downloadable, so not in the nightly backups
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
