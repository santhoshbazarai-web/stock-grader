[project]
name = "stock-grader"
version = "0.1.0"
description = "Stock Grader backend — valuation, technicals and scoring for NSE equities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "cryptography>=43",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "fyers-apiv3>=3.1.18",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.118",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "responses>=0.26.3",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]
ignore = [
    "ANN401",
    "N818",  # exception names come from the spec (ProviderUnavailable, RateLimitTimeout)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "SIM300"]  # SIM300 misfires on `x == pytest.approx(y)`

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "fyers_apiv3.*"]
ignore_missing_imports = true
